    <link rel="stylesheet" href="/css/style.css?v=3">
    <style>
    /* Ciò che ti fa stare bene. A playlist page: the hero is a small toy that belongs to the playlist. Scoped under .fb. */
    .fb { --mp-paper:#fff0f3; --mp-ink:#3a1a2a; --mp-acc:#1f8a7e; }

    .fb { background: var(--color-chalk); }
    .fb .site-footer { margin-top: 0; }
    .mp-clip { overflow-x: clip; }
    .mp-hero { position: relative; min-height: 100vh; min-height: 100svh; display: flex; align-items: flex-end; overflow: hidden; }
    .mp-art { position: absolute; inset: 0; }
    .mp-hero .frame { position: relative; z-index: 3; width: 100%; padding: calc(var(--nav-height) + 1.5rem) var(--gutter) clamp(2rem,5vw,4rem); pointer-events: none; }
    .mp-hero .frame a, .mp-hero .frame button { pointer-events: auto; }
    .mp-kick { margin: 1.2rem 0 .8rem; font-family: var(--font-mono); font-size: .76rem; letter-spacing: .1em; text-transform: uppercase; }
    .mp-hero h1 { font-weight: 300; font-size: clamp(3.4rem,9vw,8.4rem); line-height: .92; margin: 0 0 1.2rem; }
    .mp-lede { color: inherit; max-width: 34rem; margin: 0; font-size: clamp(1.1rem,1.6vw,1.35rem); line-height: 1.5; }
    .mp-hint { color: inherit; margin: 1.4rem 0 0; font: .72rem var(--font-mono); letter-spacing: .1em; text-transform: uppercase; opacity: .7; }
    .mp-listen { padding: clamp(3.5rem,7vw,6rem) 0; background: var(--mp-paper); color: var(--mp-ink); }
    .mp-grid { display: grid; grid-template-columns: minmax(0,5fr) minmax(0,7fr); gap: clamp(1.5rem,4vw,4rem); align-items: start; }
    .mp-listen h2 { font-weight: 300; font-size: clamp(2.3rem,4.6vw,3.8rem); line-height: 1.04; margin: 0 0 1.4rem; color: inherit; }
    .mp-listen p { font-size: 1.14rem; line-height: 1.65; margin: 0 0 1.2rem; color: inherit; }
    .mp-listen a { color: inherit; border-bottom: 1px solid var(--mp-acc); }
    .mp-listen a:hover { color: var(--mp-acc); }
    .mp-listen iframe { display: block; width: 100%; height: 452px; border: 0; border-radius: 12px; background: #111; }
    .mp-end { padding: 1.6rem 0 2.4rem; background: var(--mp-paper); color: var(--mp-ink); }
    .mp-end .frame { display: flex; flex-wrap: wrap; gap: 1rem 2rem; }
    .mp-end .back-link { color: var(--mp-ink); }
    @media (max-width: 860px) { .mp-grid { grid-template-columns: 1fr; } }
    @media (prefers-reduced-motion: reduce) { .mp-art * { animation: none !important; } }
    .fb .mp-hero .mp-lede, .fb .mp-hero .mp-hint { color: #3a1a2a; }
    .fb .mp-hero { background: #ffd6e0; color: #3a1a2a; }
    .fb .mp-hero h1 { color: #3a1a2a; } .fb .mp-kick { color: #a1304f; }
    .fb .mp-hero .back-link { color: #3a1a2a; }

    .fb canvas { position: absolute; inset: 0; width: 100%; height: 100%; cursor: pointer; }
    </style>

<body class="has-cover fb">
    <div id="site-header"></div>
    <div class="mp-clip">
    <header class="mp-hero">
        <div class="mp-art"><canvas id="fb-c" aria-label="Press anywhere for confetti"></canvas></div>
        <div class="frame">
            <a href="/hobbies/music.html" class="back-link">Back to Music</a>

            <h1 style="font-size:clamp(2.4rem,5.2vw,5rem);max-width:62%">Ciò che ti fa stare bene</h1>

    <script>
    (function () {

  function fit(cv) { var d = Math.min(2, devicePixelRatio || 1); cv.width = cv.clientWidth * d; cv.height = cv.clientHeight * d; var x = cv.getContext('2d'); x.setTransform(d,0,0,d,0,0); return x; }
  var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  var cv = document.getElementById('fb-c'), ctx = fit(cv), P = [], col = ['#2a9d8f', '#e76f51', '#f4a261', '#264653', '#e9c46a', '#ff4f8b'];
  addEventListener('resize', function () { ctx = fit(cv); });
  function burst(x, y) { for (var i = 0; i < 70; i++) { var a = Math.random() * 6.283, v = 3 + Math.random() * 9; P.push({ x: x, y: y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 5, r: Math.random() * 6.28, vr: (Math.random() - .5) * .4, c: col[i % col.length], l: 1 }); } }
  cv.addEventListener('pointerdown', function (e) { var r = cv.getBoundingClientRect(); burst(e.clientX - r.left, e.clientY - r.top); });
  setTimeout(function () { burst(cv.clientWidth * .68, cv.clientHeight * .3); }, 500);
  function draw() { ctx.clearRect(0, 0, cv.clientWidth, cv.clientHeight);
    P = P.filter(function (p) { return p.l > 0 && p.y < cv.clientHeight + 20; });
    P.forEach(function (p) { p.x += p.vx; p.y += p.vy; p.vy += .22; p.vx *= .985; p.r += p.vr; p.l -= .004; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.globalAlpha = Math.min(1, p.l * 2); ctx.fillRect(-7, -3, 14, 6); ctx.restore(); });
    requestAnimationFrame(draw); }
  draw();
    })();
    </script>
